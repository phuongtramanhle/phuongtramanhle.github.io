<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anh LE Data Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: light theme only. "Sage & coral" palette: soft green ground so the four dashboards
   (slate, steel blue, purple, dusty rose) stay the most colorful thing on the page. Trainer template layout and type; only the colors change.
   Research list, Skills band, dashboard cards that open a viewer with the video walkthrough, Contact. */
:root {
  --bg:#ffffff; --surface:#f2f8f4; --hero:#cde3d6; --cta:#f4b9a8;
  --ink:#45524b; --muted:#7f8c85; --line:#e1ebe5; --on-hero:#24503a; --on-hero-text:#2f5c45; --cta-ink:#5e2617;
  --accent:#4f8a6b; --accent-ink:#ffffff; --accent-soft:#e7f2ec; --cta-soft:#fdeee9;
  --shadow:0 18px 40px -26px rgba(50,90,70,.4); --scrim:rgba(28,44,36,.55);
  color-scheme:light;
  --f-display:"Open Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
body.locked{overflow:hidden}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,.card:focus-visible{outline:2px solid var(--cta);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
.label{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{font-weight:700;font-size:1.02rem;text-decoration:none;color:var(--ink)}
.nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav ul a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:600}
.nav ul a:hover{color:var(--ink)}
@media (max-width:600px){.nav ul{gap:14px}}

/* Hero */
.hero-outer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;max-width:1240px;margin:0 auto;background:var(--hero);border-radius:28px 28px 28px 110px;overflow:hidden}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;padding-block:56px 0}
.hero.solo .wrap{grid-template-columns:1fr;padding-block:56px}
.hero-text{min-width:0;padding-bottom:64px}
.hero .label{color:var(--accent)}
.hero h1{font-weight:700;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.05;margin:0 0 20px;color:var(--on-hero)}
.hero .intro{margin:0 0 30px;color:var(--on-hero-text);font-size:1.06rem;max-width:33em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:999px;font:600 .9rem var(--f-body);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.white{background:var(--bg);color:var(--ink)}
.btn.outline{background:transparent;color:var(--on-hero);border-color:color-mix(in srgb,var(--on-hero) 70%,transparent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.portrait{justify-self:end;align-self:end;width:100%;max-width:440px}
.portrait img{width:100%;height:auto;display:block}
@media (max-width:820px){
  .hero{border-radius:24px 24px 24px 64px}
  .hero .wrap{grid-template-columns:1fr;gap:0;padding-block:28px 0}
  .portrait{justify-self:center;max-width:300px}
  .hero-text{padding-bottom:28px}
}

section.block>.wrap{padding-block:64px}
section.minor>.wrap{padding-block:48px}
.sec-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:28px}
#cases .sec-head{flex-direction:row;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:16px}
h2{font-weight:700;font-size:clamp(1.5rem,3vw,2.05rem);margin:0;color:var(--ink)}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem;max-width:40em}

/* Research list */
.papers{display:grid;border-top:1px solid var(--line)}
.paper{display:grid;grid-template-columns:11em minmax(0,1fr) auto;gap:8px 28px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)}
.paper .kind{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.paper h3{font-size:1.12rem;line-height:1.35;margin:0 0 4px;color:var(--ink)}
.paper .by{margin:0 0 8px;font-size:.92rem;color:var(--ink)}
.paper .by span{color:var(--muted)}
.paper .abs{margin:0;color:var(--muted);font-size:.95rem;max-width:60em;text-align:justify;hyphens:auto}
.paper a.open{white-space:nowrap}
@media (max-width:760px){.paper{grid-template-columns:1fr;gap:4px}}

/* Skills band */
#skills{background:var(--hero);position:relative;overflow:hidden}
#skills h2,#skills .course h3{color:var(--on-hero)}
#skills .sec-head p{color:var(--on-hero-text)}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px 36px}
.course h3{font-size:1rem;font-weight:700;margin:0 0 6px}
.course p{margin:0;color:var(--on-hero-text);font-size:.95rem}
.able{margin:32px 0 0;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--on-hero) 45%,transparent);display:grid;grid-template-columns:11em minmax(0,1fr);gap:6px 24px;color:var(--on-hero-text);font-size:.95rem}
.able dt{font-weight:700;color:var(--on-hero)}
.able dd{margin:0}
@media (max-width:600px){.able{grid-template-columns:1fr}.able dd{margin-bottom:10px}}
.certs{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.cert{display:inline-flex;gap:10px;align-items:center;padding:7px 16px 7px 7px;border-radius:999px;background:var(--bg);font-size:.92rem;color:var(--ink);text-decoration:none}
.cert code{font-family:var(--f-body);font-size:.75rem;font-weight:700;background:var(--cta);color:var(--cta-ink);padding:4px 10px;border-radius:999px}

/* Case cards */
#cases>.wrap{padding-block:64px 72px}
.projects{display:grid;gap:22px}
.card{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:36px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:28px;background:var(--bg);cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover{border-color:var(--cta);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-2px)}}
.card-body{min-width:0;padding-right:12px}
.frame{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frame iframe,.frame video,.frame>img{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.frame>img{object-fit:cover;object-position:top left}
.note{position:absolute;right:3%;bottom:4%;font-size:clamp(8px,1vw,11px);font-weight:700;background:var(--accent-soft);color:var(--accent);padding:.3em .8em;border-radius:999px}
.card h3{font-weight:700;font-size:1.3rem;line-height:1.3;margin:0 0 10px}
.card p.sum{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:999px;color:var(--accent);background:var(--accent-soft)}
.card-foot{margin-top:20px}
.card .btn.primary{background:var(--cta);color:var(--cta-ink)}
.more{display:flex;justify-content:center;margin-top:36px}
@media (max-width:760px){.card{grid-template-columns:1fr;gap:18px;padding:12px;border-radius:24px}.card-body{padding:0 6px 8px}}

/* Case viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:1160px;background:var(--bg);color:var(--ink);border-radius:28px;padding:24px 28px 30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.sheet-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:18px}
.sheet-head h3{font-weight:700;font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.2;margin:0}
.close{flex:none;font:600 .85rem var(--f-body);background:var(--surface);border:0;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.notes{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:32px;margin-top:24px}
.notes>div{min-width:0}
.notes p{margin:0 0 14px;color:var(--muted)}
.notes dl{margin:0;display:grid;gap:14px}
.notes dt{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.notes dd{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.insights{margin-top:26px;padding:22px 24px;background:var(--surface);border-radius:20px}
.insights ul{margin:6px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px 32px}
.insights li{position:relative;padding-left:20px;font-size:.95rem;font-variant-numeric:tabular-nums}
.insights li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--cta)}
@media (max-width:760px){.insights ul{grid-template-columns:1fr}.insights{padding:18px}}
a.open{font-weight:700;text-decoration:none}
a.open:hover{text-decoration:underline}
@media (max-width:860px){.notes{grid-template-columns:1fr;gap:18px}.sheet{padding:16px;border-radius:22px}}

/* Contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;background:var(--cta-soft);border-radius:28px 28px 28px 90px;padding:40px}
.contact p{color:var(--muted);max-width:44ch;margin:12px 0 0}
.links{display:grid}
.link{display:grid;grid-template-columns:7em 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--cta) 35%,transparent)}
.link:last-child{border-bottom:0}
.link .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.link .val{font-weight:600;overflow-wrap:anywhere;min-width:0}
.link a.val{text-decoration:none}
.link a.val:hover{text-decoration:underline}
.copy{font:600 .75rem var(--f-body);background:var(--bg);border:0;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
@media (max-width:760px){.contact{grid-template-columns:1fr;gap:20px;padding:24px;border-radius:24px 24px 24px 56px}.link{grid-template-columns:5.5em 1fr auto}}
footer .wrap{padding-block:28px 32px;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head><body>

  intro: "I hold a PhD in Finance and research how firms absorb physical climate shocks and how early warning models can flag corporate bankruptcy. I turn financial and market data into clear evidence, from econometric models in R and Stata to interactive Power BI dashboards.",

  research: [
    { kind: "Working paper", title: "The Effects of Natural Disasters on Firm Value: Evidence from Hurricane Sandy",
      by: "with Sylvain Marsat and Guillaume Pijourlet", note: "Presented at the 39th AFFI International Conference, 2023",
      abs: "Natural disasters are commonly viewed as value-destroying shocks for affected firms. This paper revisits this view by examining the impact of Hurricane Sandy on the market value of 3,007 US-listed firms over the period 2010–2014. Using a difference-in-differences design combined with propensity score matching, we document a positive and statistically significant effect on the market value of firms located in affected areas. Following the disaster, these firms also exhibit higher return on assets, stronger sales growth and higher dividend yields, alongside lower capital expenditure." },
    { kind: "Working paper", title: "Financial Resilience to Hurricane Sandy: The Value of Intangible Assets",
      by: "with Brice Foulon", note: "Presented at the 40th AFFI International Conference, 2024",
      abs: "Natural disasters threaten firms' operations, assets and profitability, yet firms differ in their ability to recover. This paper examines whether intangible assets accumulated before a disaster contribute to corporate resilience. Using survival analysis on a sample of 378 US firms affected by Hurricane Sandy, we find that a higher pre-disaster share of intangible assets is associated with faster share-price recovery and a smaller decline in firm performance. The findings remain robust across alternative survival model specifications and observation windows, highlighting intangible assets as an important potential source of corporate resilience to natural disasters." },
    { kind: "Work in progress", title: "A Kalman-Filter Early Warning Model for Corporate Bankruptcy",
      by: "", note: "",
      abs: "Traditional bankruptcy prediction models based on accounting ratios may be limited by noisy financial data and reporting delays. This project addresses these limitations by modelling firms' financial health as a latent state estimated using a Kalman filter, applied to a quarterly panel of US-listed firms constructed from SEC EDGAR filings. Filing delays are also incorporated as an additional early warning signal. We benchmark the proposed model against established hazard models, NUS-CRI default probabilities and machine learning approaches, including XGBoost and LSTM, to evaluate predictive performance and interpretability." }
  ],

      insights: [
        "2023 was a year of costly growth: revenue rose 92%, but costs rose about 110%, faster than revenue, so the loss widened and the margin fell to -22.3%.",

      insights: [
        "Material spend reached €589.2M, €35.1M above budget, even though production stayed on plan (2,561 units against 2,565).",

const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = u => e(String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""));
const S = SITE, C = S.contact, T = S.skills;
const n = S.projects.length;

// YouTube watch, share or shorts link -> privacy-friendly embed URL
function embed(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  return m ? `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0` : "";
}

// Cards show the first page of the dashboard. The viewer plays the video walkthrough.
function frame(p, live) {
  if (live && HOSTED && p.embedUrl) return `<iframe title="${e(p.title)}" src="${e(p.embedUrl)}" loading="lazy" allowfullscreen></iframe>`;
  const tag = !live ? "" : p.embedUrl ? "Interactive report loads on the hosted site" : "Interactive report coming soon";
  return `<img src="${e(p.image)}" alt="First page of ${e(p.title)}">` + (tag ? `<span class="note">${tag}</span>` : "");
}

function card(p, i) {
  return `<article class="card" id="case-${i + 1}" data-i="${i}" tabindex="0"${i >= FEATURED ? " hidden" : ""}>
    <div class="frame">${frame(p, false)}</div>
    <div class="card-body"><p class="label">${e(p.tag)}</p><h3>${e(p.title)}</h3><p class="sum">${e(p.summary)}</p>
      <div class="chips">${p.stack.map(s => `<span>${e(s)}</span>`).join("")}</div>
      <div class="card-foot"><button class="btn primary" type="button">View dashboard</button></div>
    </div></article>`;
}

function sheet(p) {
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="sheet-head"><div><p class="label">${e(p.tag)}</p><h3 id="viewer-title">${e(p.title)}</h3></div><button class="close" type="button" id="viewer-close">Close</button></div>
    <div class="frame">${frame(p, true)}</div>
    <div class="notes">
      <div><p>${e(p.summary)}</p>${p.embedUrl ? `<a class="open" href="${e(p.embedUrl)}" target="_blank" rel="noopener">Open full screen ↗</a>` : ""}</div>
      <div><dl><div><dt>Question</dt><dd>${e(p.problem)}</dd></div><div><dt>What I built</dt><dd>${e(p.approach)}</dd></div></dl></div>
      <div><div class="chips">${p.stack.map(s => `<span>${e(s)}</span>`).join("")}</div></div>
    </div>
    <div class="insights"><p class="label">Key insights</p><ul>${p.insights.map(t => `<li>${e(t)}</li>`).join("")}</ul></div>
    </div>`;
}

function paper(r) {
  return `<article class="paper"><span class="kind">${e(r.kind)}</span>
    <div><h3>${e(r.title)}</h3>${r.by || r.note ? `<p class="by">${e(r.by)}${r.by && r.note ? " · " : ""}<span>${e(r.note)}</span></p>` : ""}<p class="abs">${e(r.abs)}</p></div>
    ${r.url ? `<a class="open" href="${e(r.url)}" target="_blank" rel="noopener">${e(r.link)} ↗</a>` : "<span></span>"}</article>`;
}

const links = [
  C.email && `<div class="link"><span class="lbl">Email</span><span class="val" id="email">${e(C.email)}</span><button class="copy" type="button" id="copy-email">Copy</button></div>`,
  C.linkedin && `<div class="link"><span class="lbl">LinkedIn</span><a class="val" href="${e(C.linkedin)}" target="_blank" rel="noopener">${short(C.linkedin)}</a><span aria-hidden="true">↗</span></div>`,
  ...C.links.map(l => `<div class="link"><span class="lbl">${e(l.label)}</span><a class="val" href="${e(l.url)}" target="_blank" rel="noopener">${short(l.url)}</a><span aria-hidden="true">↗</span></div>`)
].filter(Boolean).join("");

document.getElementById("app").innerHTML = `
<nav class="nav" aria-label="Main"><div class="wrap"><a class="brand" href="#top">${e(S.name)}</a><ul>
  <li><a href="#cases">Dashboards</a></li><li><a href="#research">Research</a></li><li><a href="#skills">Skills</a></li><li><a href="#contact">Let's talk</a></li></ul></div></nav>

<div class="hero-outer"><header class="hero${S.photo ? "" : " solo"}" id="top"><div class="wrap">
  <div class="hero-text">
    <p class="label">${e(S.role)}${S.location ? ` · ${e(S.location)}` : ""}</p>
    <h1>${e(S.name)}</h1>
    <p class="intro">${e(S.intro)}</p>
    <div class="cta"><a class="btn white" href="#cases">See my dashboards</a><a class="btn outline" href="#research">See my research</a></div>
  </div>
  ${S.photo ? `<div class="portrait"><img src="${e(S.photo)}" alt="Portrait of ${e(S.name)}"></div>` : ""}
</div></header></div>

<section class="block" id="cases"><div class="wrap">
  <div class="sec-head"><h2>Dashboard projects</h2></div>
  <div class="projects">${S.projects.map(card).join("")}</div>
  ${n > FEATURED ? `<div class="more"><button class="btn soft" type="button" id="see-all" aria-expanded="false">View all dashboards</button></div>` : ""}
</div></section>

<section class="block" id="research"><div class="wrap">
  <div class="sec-head"><h2>Research</h2></div>
  <div class="papers">${S.research.map(paper).join("")}</div>
</div></section>

<section class="block minor" id="skills"><div class="wrap">
  <div class="sec-head"><h2>Skills &amp; certificates</h2></div>
  <div class="courses">${T.groups.map(c => `<div class="course"><h3>${e(c.name)}</h3>${c.items.length ? `<p>${c.items.map(e).join(" · ")}</p>` : ""}</div>`).join("")}</div>
  <dl class="able"><dt>Data sources</dt><dd>${e(T.data)}</dd><dt>Languages</dt><dd>${e(T.languages)}</dd></dl>
  <div class="certs">${T.certs.map(c => `<a class="cert" href="${e(c.url)}" target="_blank" rel="noopener"><code>${e(c.code)}</code>${e(c.name)} ↗</a>`).join("")}</div>
</div></section>

<section class="block minor" id="contact"><div class="wrap"><div class="contact"><div><h2>Let's talk</h2><p>${e(C.intro)}</p></div><div class="links">${links}</div></div></div></section>
<footer><div class="wrap">${e(S.name)} · Finance research and data analytics</div></footer>
<div class="viewer" id="viewer" hidden></div>`;

// Case viewer
const viewer = document.getElementById("viewer");
let lastFocus = null;
function openCase(i) {
  lastFocus = document.activeElement;
  viewer.innerHTML = sheet(S.projects[i]);
  viewer.hidden = false;
  document.body.classList.add("locked");
  document.getElementById("viewer-close").focus();
}
function closeCase() {
  viewer.hidden = true;
  viewer.innerHTML = "";
  document.body.classList.remove("locked");
  if (lastFocus) lastFocus.focus();
}
const list = document.querySelector(".projects");
list.addEventListener("click", ev => { const c = ev.target.closest(".card"); if (c) openCase(+c.dataset.i); });
list.addEventListener("keydown", ev => { const c = ev.target.closest(".card"); if (c && ev.target === c && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openCase(+c.dataset.i); } });
viewer.addEventListener("click", ev => { if (ev.target === viewer || ev.target.id === "viewer-close") closeCase(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !viewer.hidden) closeCase(); });

const seeAll = document.getElementById("see-all");
if (seeAll) seeAll.addEventListener("click", () => {
  const open = seeAll.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll(".projects .card").forEach((a, i) => { if (i >= FEATURED) a.hidden = !open; });
  seeAll.setAttribute("aria-expanded", String(open));
  seeAll.textContent = open ? "Show fewer" : "View all dashboards";
  if (open) document.getElementById(`case-${FEATURED + 1}`).scrollIntoView({ block: "start" });
});

const btn = document.getElementById("copy-email");
if (btn) btn.addEventListener("click", () => {
  const el = document.getElementById("email");
  const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
  try { navigator.clipboard.writeText(el.textContent).then(() => btn.textContent = "Copied", sel); } catch (_) { sel(); }
  setTimeout(() => btn.textContent = "Copy", 1600);
});
</script>
